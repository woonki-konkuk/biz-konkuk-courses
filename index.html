<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내가 들은 과목 이수구분 확인하기 | 건국대학교 경영대학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 색은 건국대 경영학과 홈페이지(biz.konkuk.ac.kr)와 맞춤 */
:root{
  --ink:#121212; --text:#333; --sub:#666; --faint:#888; --ghost:#bbb;
  --line:#e5e5e5; --line2:#ccc;
  --green:#046b40;        /* 로고 블록 */
  --green-bright:#00a754; /* 메뉴 버튼 */
  --tint:#edf7f1; --tintline:#cfe8da;
  --footer:#343539;       /* 푸터 */
  --gutter:clamp(16px,4vw,40px);
  --sans:'IBM Plex Sans KR',system-ui,'Apple SD Gothic Neo',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --num:'Jost','IBM Plex Sans KR',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 var(--gutter)}
.mono{font-family:var(--mono)}

/* 히어로 */
.hero{background:var(--green);color:#fff}
.topbar{display:flex;align-items:center;height:60px;font-size:13px;letter-spacing:.04em;color:rgba(255,255,255,.75)}
.hero-body{padding:20px 0 48px}
h1{margin:0;font-size:clamp(27px,4.6vw,42px);font-weight:700;line-height:1.3;letter-spacing:-.045em}
h1 em{font-style:normal;background:linear-gradient(transparent 64%,var(--green-bright) 64%)}
.hero-intro{margin:16px 0 0;max-width:560px;font-size:14px;line-height:1.8;color:rgba(255,255,255,.85)}
.hero-meta{margin:24px 0 0;font-size:12.5px;color:rgba(255,255,255,.65)}
.hero-meta .mono{letter-spacing:.08em}

/* 찾는 방법 탭 */
main{padding:26px 0 80px}
.tabs{display:flex;gap:28px;margin-bottom:36px;border-bottom:1px solid var(--line)}
.tab{padding:6px 0 10px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--faint);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green-bright)}
.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--green-bright);outline-offset:3px}

.field + .field{margin-top:28px}
.field-label{display:block;margin:0 0 12px;font-size:15px;font-weight:700;color:var(--ink)}
.field-label small{margin-left:8px;font-size:12.5px;font-weight:400;color:var(--faint)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border:0;border-radius:6px;background:#f2f3f4;color:var(--text);font:inherit;font-size:14px;font-weight:500;line-height:1.4;cursor:pointer;transition:background .15s,color .15s}
.chips.years .chip{font-family:var(--mono);font-size:13.5px}
.chip:hover{background:var(--tint);color:var(--green)}
.chip.on{background:var(--green);color:#fff}
.chip .n{margin-left:5px;font-family:var(--mono);font-size:12px;opacity:.6}

/* 결과 */
.results{margin-top:44px}
.hint,.empty{padding:36px 0;border-top:1px solid var(--line);text-align:center;color:var(--faint)}
.result-head + .empty{border-top:0}
.result-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.result-title{font-size:15px;font-weight:600;color:var(--ink)}
.result-title i{margin:0 7px;font-style:normal;color:var(--ghost)}
.big{font-family:var(--num);font-size:30px;font-weight:600;line-height:1;color:var(--green)}
.big small{margin-left:5px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--sub)}
.group-head{display:flex;align-items:baseline;gap:8px;margin-top:30px;padding-bottom:8px;border-bottom:1px solid var(--line2)}
.group-name{font-size:16px;font-weight:700;color:var(--green)}
.group-count{font-family:var(--mono);font-size:12px;color:var(--faint)}
.course{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.course-name{font-size:15.5px;font-weight:600;color:var(--ink)}
.meta{margin-top:2px;font-size:13px;color:var(--sub)}
.meta .mono{font-size:12.5px}
.tag{flex:none;display:inline-block;padding:2px 10px;border:1px solid var(--tintline);border-radius:999px;background:var(--tint);color:var(--green);font-size:12.5px;font-weight:600;white-space:nowrap}

/* 과목명으로 찾기 */
.search{width:100%;padding:13px 16px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.search:focus{outline:none;border-color:var(--green-bright)}
.help{margin:8px 0 0;font-size:12.5px;color:var(--faint)}
.note{margin:12px 0 0;font-size:13px;color:var(--sub)}
.subject{padding-top:30px}
.subject-name{font-size:17px;font-weight:700;color:var(--ink)}
.matrix{width:100%;margin-top:12px;border-collapse:collapse;font-size:14px}
.matrix th,.matrix td{padding:9px 12px 9px 0;text-align:left;border-bottom:1px solid var(--line)}
.matrix thead th{padding-bottom:8px;border-bottom:1px solid var(--ink);font-size:12px;font-weight:600;color:var(--sub)}
.matrix tbody th{font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--green);white-space:nowrap}
.matrix td.none{color:var(--ghost)}

/* 문의 (홈페이지 푸터 색) */
.contact{background:var(--footer);color:rgba(255,255,255,.7);font-size:14px}
.contact .wrap{padding-top:32px;padding-bottom:44px}
.contact-title{margin:0 0 12px;font-size:15px;font-weight:700;color:#fff}
.contact dl{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:4px 18px;margin:0}
.contact dt{font-size:12.5px;color:rgba(255,255,255,.5)}
.contact dd{margin:0}
.contact a{color:#fff;text-decoration:none}
.contact a:hover{text-decoration:underline}

@media (max-width:560px){
  .hero-body{padding:12px 0 38px}
  .big{font-size:26px}
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="topbar">건국대학교 경영대학</div>
    <div class="hero-body">
      <h1>내가 들은 과목<br><em>이수구분</em> 확인하기</h1>
      <p class="hero-intro">학과와 입학년도로 골라 보거나 과목명으로 검색해서, 내가 들은 과목이 어떤 이수구분인지 확인하세요.</p>
      <p class="hero-meta" id="heroMeta"></p>
    </div>
  </div>
</header>

<div class="wrap">
<main>
  <div class="tabs" role="tablist" aria-label="찾는 방법">
    <button type="button" class="tab" role="tab" id="tabPick" aria-selected="true" aria-controls="pickPanel" data-mode="pick">학과·입학년도로 찾기</button>
    <button type="button" class="tab" role="tab" id="tabSearch" aria-selected="false" aria-controls="searchPanel" data-mode="search">과목명으로 찾기</button>
  </div>

  <div id="pickPanel" role="tabpanel" aria-labelledby="tabPick">
    <div class="field">
      <p class="field-label" id="deptLabel">학과</p>
      <div id="deptChips" class="chips" role="group" aria-labelledby="deptLabel"></div>
    </div>
    <div class="field">
      <p class="field-label" id="yearLabel">입학년도</p>
      <div id="yearChips" class="chips years" role="group" aria-labelledby="yearLabel"></div>
    </div>
    <div class="field">
      <p class="field-label" id="catLabel">이수구분<small>눌러서 좁혀 보기</small></p>
      <div id="catChips" class="chips" role="group" aria-labelledby="catLabel"></div>
    </div>
    <section id="courseResult" class="results" aria-label="조회 결과"></section>
  </div>

  <div id="searchPanel" role="tabpanel" aria-labelledby="tabSearch" hidden>
    <div class="field">
      <label class="field-label" for="q">과목명</label>
      <input id="q" class="search" type="search" placeholder="예: 마케팅, 회계원리" autocomplete="off" enterkeyhint="search">
      <p class="help">일부만 입력해도 되고, 학수번호로도 찾을 수 있어요.</p>
    </div>
    <section id="searchResult" class="results" aria-label="검색 결과"></section>
  </div>
</main>
</div>

<footer class="contact">
  <div class="wrap">
    <p class="contact-title">문의</p>
    <dl>
      <dt>담당</dt><dd>경영대학 행정실 · 김현지</dd>
      <dt>위치</dt><dd>서울시 광진구 능동로 120, 경영관 210호</dd>
      <dt>전화</dt><dd><a href="tel:02-450-3671">02-450-3671</a></dd>
      <dt>이메일</dt><dd><a href="mailto:guswl@konkuk.ac.kr">guswl@konkuk.ac.kr</a></dd>
    </dl>
  </div>
</footer>

<script src="data.js"></script>
<script>
const departments = [...new Set(DATA.map(x => x["학과"]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
const years = [...new Set(DATA.map(x => String(x["학년도"])))].sort((a,b)=>a-b);
const CATEGORY_ORDER = ['지교','지교B','지필','반교','전기','전필','전선','전선B'];
const rank = c => { const i = CATEGORY_ORDER.indexOf(c); return i < 0 ? CATEGORY_ORDER.length : i; };
const byCategory = (a,b) => rank(a) - rank(b) || String(a).localeCompare(String(b),'ko');
const categories = [...new Set(DATA.map(x => x["이수구분"]).filter(Boolean))].sort(byCategory);

document.getElementById('heroMeta').innerHTML =
  `<span class="mono">${years[0]}—${years[years.length - 1]}</span> 입학 · ${departments.map(d => escapeHtml(d)).join(' · ')}`;

// ── 찾는 방법 탭
const tabs = [...document.querySelectorAll('.tab')];
tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

function setMode(mode){
  tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.mode === mode)));
  document.getElementById('pickPanel').hidden = mode !== 'pick';
  document.getElementById('searchPanel').hidden = mode !== 'search';
  if(mode === 'search') qEl.focus();
}

// ── 학과·입학년도로 찾기 (+ 이수구분으로 좁히기)
const state = { dept: '', year: '', cat: '전체' };
const resultEl = document.getElementById('courseResult');

document.getElementById('pickPanel').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  state[chip.dataset.group] = chip.dataset.value;
  render();
});

function render(){
  const ready = !!(state.dept && state.year);
  const base = ready ? DATA.filter(x => x["학과"] === state.dept && String(x["학년도"]) === state.year) : [];
  const counts = {};
  base.forEach(x => { counts[x["이수구분"]] = (counts[x["이수구분"]] || 0) + 1; });
  // 고른 이수구분이 이 학과·입학년도에 없으면 전체로 되돌린다
  if(ready && state.cat !== '전체' && !counts[state.cat]) state.cat = '전체';

  renderChips('deptChips', 'dept', departments.map(d => [d, d]));
  renderChips('yearChips', 'year', years.map(y => [y, y]));
  renderChips('catChips', 'cat', [['전체', '전체', ready ? base.length : null],
    ...categories.filter(c => !ready || counts[c]).map(c => [c, c, ready ? counts[c] : null])]);

  if(!ready){
    const need = [!state.dept && '학과', !state.year && '입학년도'].filter(Boolean).join('와 ');
    resultEl.innerHTML = `<div class="hint">${need}를 누르면 과목이 바로 나타나요</div>`;
    return;
  }

  const rows = (state.cat === '전체' ? base : base.filter(x => x["이수구분"] === state.cat))
    .sort((a,b) => String(a["과목명"]).localeCompare(String(b["과목명"]),'ko') || String(a["학수번호"]).localeCompare(String(b["학수번호"])));

  let body;
  if(!rows.length){
    body = '<div class="empty">해당 조건의 과목이 없습니다.</div>';
  } else if(state.cat === '전체'){
    body = [...new Set(rows.map(r => r["이수구분"]))].sort(byCategory).map(c => {
      const list = rows.filter(r => r["이수구분"] === c);
      return `<div class="group-head"><span class="group-name">${escapeHtml(c || '기타')}</span><span class="group-count">${list.length}</span></div>` + list.map(courseHtml).join('');
    }).join('');
  } else {
    body = rows.map(courseHtml).join('');
  }

  resultEl.innerHTML = `
    <div class="result-head">
      <div class="result-title">${escapeHtml(state.dept)}<i>·</i>${escapeHtml(state.year)}년 입학<i>·</i>${escapeHtml(state.cat)}</div>
      <div class="big">${rows.length}<small>과목</small></div>
    </div>${body}`;
}

function renderChips(id, group, items){
  document.getElementById(id).innerHTML = items.map(([value, label, n]) => {
    const on = state[group] === value;
    return `<button type="button" class="chip${on ? ' on' : ''}" aria-pressed="${on}" data-group="${group}" data-value="${escapeHtml(value)}">${escapeHtml(label)}${n == null ? '' : `<span class="n">${n}</span>`}</button>`;
  }).join('');
}

// "3-1,2" → "3학년 1·2학기"
function termLabel(t){
  const m = String(t || '').match(/^(\d)-(\d(?:,\d)*)$/);
  return m ? `${m[1]}학년 ${m[2].split(',').join('·')}학기` : String(t || '');
}

function courseHtml(r){
  const meta = [
    r["학수번호"] && `<span class="mono">${escapeHtml(r["학수번호"])}</span>`,
    r["학년·학기"] && escapeHtml(termLabel(r["학년·학기"])),
    r["학점"] && `${escapeHtml(r["학점"])}학점`
  ].filter(Boolean).join(' · ');
  return `
    <div class="course">
      <div><div class="course-name">${escapeHtml(r["과목명"])}</div><div class="meta">${meta}</div></div>
      <span class="tag">${escapeHtml(r["이수구분"])}</span>
    </div>`;
}

// ── 과목명으로 찾기: 과목마다 입학년도 × 학과 이수구분 표
const byName = new Map();
DATA.forEach(r => {
  if(!byName.has(r["과목명"])) byName.set(r["과목명"], []);
  byName.get(r["과목명"]).push(r);
});
const squash = s => String(s ?? '').replace(/\s/g, '').toLowerCase();
const matchRank = (name, q) => { const s = squash(name); return s === q ? 0 : s.startsWith(q) ? 1 : 2; };

const qEl = document.getElementById('q');
const searchEl = document.getElementById('searchResult');
qEl.addEventListener('input', renderSearch);
qEl.addEventListener('keydown', e => { if(e.key === 'Enter') qEl.blur(); });

function renderSearch(){
  const raw = qEl.value.trim();
  const q = squash(raw);
  if(!q){
    searchEl.innerHTML = '<div class="hint">과목명을 입력하면 학과·입학년도별 이수구분을 모두 보여드려요</div>';
    return;
  }
  const names = [...byName.keys()]
    .filter(n => squash(n).includes(q) || byName.get(n).some(r => squash(r["학수번호"]).includes(q)))
    .sort((a,b) => matchRank(a,q) - matchRank(b,q) || a.localeCompare(b,'ko'));
  if(!names.length){
    searchEl.innerHTML = `<div class="empty">‘${escapeHtml(raw)}’에 해당하는 과목이 없어요</div>`;
    return;
  }
  searchEl.innerHTML = `
    <div class="result-head">
      <div class="result-title">‘${escapeHtml(raw)}’ 검색 결과</div>
      <div class="big">${names.length}<small>개 과목</small></div>
    </div>
    <p class="note">내 학과 열과 입학년도 줄이 만나는 칸이 내 이수구분이에요. —는 그 교육과정에 없는 과목이에요.</p>
    ${names.map(subjectHtml).join('')}`;
}

function subjectHtml(name){
  const rows = byName.get(name);
  const codes = [...new Set(rows.map(r => r["학수번호"]).filter(Boolean))];
  const credits = [...new Set(rows.map(r => r["학점"]).filter(Boolean))];
  // 입학년도마다 학과별 칸을 만들고, 바로 앞 해와 칸이 모두 같으면 한 줄로 묶는다
  const lines = [];
  years.forEach(y => {
    const cells = departments.map(d => [...new Set(rows
      .filter(r => r["학과"] === d && String(r["학년도"]) === y)
      .map(r => r["이수구분"]))].sort(byCategory).join(' · '));
    const last = lines[lines.length - 1];
    if(last && last.cells.join('|') === cells.join('|')) last.to = y;
    else lines.push({ from: y, to: y, cells });
  });
  const meta = [
    codes.length && `<span class="mono">${codes.map(c => escapeHtml(c)).join(', ')}</span>`,
    credits.length && `${credits.map(c => escapeHtml(c)).join('/')}학점`
  ].filter(Boolean).join(' · ');
  const head = `<tr><th scope="col">입학년도</th>${departments.map(d => `<th scope="col">${escapeHtml(d)}</th>`).join('')}</tr>`;
  const body = lines.map(l => `<tr><th scope="row">${l.from === l.to ? l.from : `${l.from}–${l.to}`}</th>${
    l.cells.map(c => c ? `<td><span class="tag">${escapeHtml(c)}</span></td>` : '<td class="none">—</td>').join('')}</tr>`).join('');
  return `
    <article class="subject">
      <div class="subject-name">${escapeHtml(name)}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ''}
      <table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table>
    </article>`;
}

function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

render();
renderSearch();
</script>
</body>
</html>
